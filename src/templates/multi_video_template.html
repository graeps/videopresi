<!DOCTYPE html>
<html lang="de-DE">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/styles/{{ main_css }}">
    {% for css_file in css %}
        <link rel="stylesheet" href="/static/styles/{{ css_file }}">
    {% endfor %}
    <link rel="icon" href="/images/logo_inv.svg" type="image/x-icon">
    <script>
        const imgPath = "/static/images/";
        const videoPath = "static/videos/";
    </script>
</head>

<body>
<div class="slogan-container">
    <div class="shadow">
        <h1 class="slogan">ENTDECKE NEUES AUS ALTEN ZEITEN!</h1>
    </div>
</div>

<main>
    {% for video in videos %}
        <div class="video">
            <img class="slide-img" id="{{ video.image_id }}" src="">
            <div class="shadow"></div>
            <h2>{{ video.title }}</h2>
            <p>{{ video.description }}</p>
            <a class="button" onclick="playVideo(videoPath + '{{ video.video_file }}')">Film starten</a>
        </div>
    {% endfor %}
</main>

<div class="logo-container">
    <img style="float: right;" src="/static/images/logo_inv.svg">
</div>

<script type="module" src="/static/scripts/{{ script }}"></script>
<script type="module">
    import {playVideo} from "/static/scripts/play-video.js";

    window.playVideo = playVideo;

    {% for video in videos %}
        document.querySelector('#{{ video.image_id }}').src = imgPath + '{{ video.image }}';
    {% endfor %}
</script>
</body>
</html>
